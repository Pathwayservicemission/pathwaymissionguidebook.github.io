<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>PDF Viewer</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #2b2b2b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #viewer {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  #canvas-wrap {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 10px;
  }
  #page-container {
    position: relative;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    line-height: 0;
  }
  canvas {
    background: white;
    display: block;
    max-width: 100%;
    height: auto;
  }
  /* Link annotation layer, overlaid exactly on top of the canvas */
  #link-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  #link-layer a {
    position: absolute;
    display: block;
    background: rgba(0, 100, 255, 0.0);
    cursor: pointer;
  }
  #link-layer a:hover {
    background: rgba(0, 100, 255, 0.15);
    outline: 1px solid rgba(0, 100, 255, 0.4);
  }
  #controls {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: #1e1e1e;
    color: #eee;
    width: 100%;
    justify-content: center;
  }
  button {
    background: #3a3a3a;
    color: #eee;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover:not(:disabled) {
    background: #4a4a4a;
  }
  button:disabled {
    opacity: 0.4;
    cursor: default;
  }
  #page-info {
    font-size: 14px;
    min-width: 90px;
    text-align: center;
  }
  #loading {
    color: #ccc;
    font-size: 14px;
  }
</style>
</head>
<body>

<div id="viewer">
  <div id="canvas-wrap">
    <div id="page-container">
      <canvas id="pdf-canvas"></canvas>
      <div id="link-layer"></div>
    </div>
    <div id="loading" style="display:none;">Loading PDF…</div>
  </div>
  <div id="controls">
    <button id="prev">&larr; Prev</button>
    <span id="page-info">Page - / -</span>
    <button id="next">Next &rarr;</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  // ---- CONFIG: change this to your PDF's filename in the repo ----
  const PDF_URL = "Missionary Guidebook  (1).pdf";
  // ------------------------------------------------------------------

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  let pdfDoc = null;
  let pageNum = 1;
  let pageRendering = false;
  let pageNumPending = null;
  const canvas = document.getElementById("pdf-canvas");
  const ctx = canvas.getContext("2d");
  const linkLayer = document.getElementById("link-layer");
  const pageInfo = document.getElementById("page-info");
  const prevBtn = document.getElementById("prev");
  const nextBtn = document.getElementById("next");
  const loading = document.getElementById("loading");

  function clearLinkLayer() {
    linkLayer.innerHTML = "";
  }

  function renderLinks(page, viewport) {
    clearLinkLayer();
    page.getAnnotations().then(function (annotations) {
      annotations.forEach(function (ann) {
        if (ann.subtype !== "Link") return;

        const rect = pdfjsLib.Util.normalizeRect(
          viewport.convertToViewportRectangle(ann.rect)
        );
        const left = Math.min(rect[0], rect[2]);
        const top = Math.min(rect[1], rect[3]);
        const width = Math.abs(rect[2] - rect[0]);
        const height = Math.abs(rect[3] - rect[1]);

        const a = document.createElement("a");
        a.style.left = left + "px";
        a.style.top = top + "px";
        a.style.width = width + "px";
        a.style.height = height + "px";
        a.title = ann.url || "";

        if (ann.url) {
          a.href = ann.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
        } else if (ann.dest) {
          a.href = "#";
          a.addEventListener("click", function (e) {
            e.preventDefault();
            if (typeof ann.dest === "string") {
              pdfDoc.getDestination(ann.dest).then(function (destArray) {
                if (destArray) {
                  pdfDoc.getPageIndex(destArray[0]).then(function (idx) {
                    pageNum = idx + 1;
                    queueRenderPage(pageNum);
                  });
                }
              });
            } else {
              pdfDoc.getPageIndex(ann.dest[0]).then(function (idx) {
                pageNum = idx + 1;
                queueRenderPage(pageNum);
              });
            }
          });
        }

        linkLayer.appendChild(a);
      });
    });
  }

  function renderPage(num) {
    pageRendering = true;
    pdfDoc.getPage(num).then(function (page) {
      const containerHeight = document.getElementById("canvas-wrap").clientHeight - 20;
      const baseViewport = page.getViewport({ scale: 1 });
      const scale = containerHeight / baseViewport.height;
      const viewport = page.getViewport({ scale: scale > 0 ? scale : 1 });

      canvas.height = viewport.height;
      canvas.width = viewport.width;
      linkLayer.style.width = viewport.width + "px";
      linkLayer.style.height = viewport.height + "px";

      const renderContext = {
        canvasContext: ctx,
        viewport: viewport,
      };
      const renderTask = page.render(renderContext);
      renderTask.promise.then(function () {
        pageRendering = false;
        renderLinks(page, viewport);
        if (pageNumPending !== null) {
          renderPage(pageNumPending);
          pageNumPending = null;
        }
      });
    });

    pageInfo.textContent = `Page ${num} / ${pdfDoc.numPages}`;
    prevBtn.disabled = num <= 1;
    nextBtn.disabled = num >= pdfDoc.numPages;
  }

  function queueRenderPage(num) {
    if (pageRendering) {
      pageNumPending = num;
    } else {
      renderPage(num);
    }
  }

  function onPrevPage() {
    if (pageNum <= 1) return;
    pageNum--;
    queueRenderPage(pageNum);
  }

  function onNextPage() {
    if (pageNum >= pdfDoc.numPages) return;
    pageNum++;
    queueRenderPage(pageNum);
  }

  prevBtn.addEventListener("click", onPrevPage);
  nextBtn.addEventListener("click", onNextPage);

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") onPrevPage();
    if (e.key === "ArrowRight") onNextPage();
  });

  loading.style.display = "block";
  pdfjsLib
    .getDocument(encodeURI(PDF_URL))
    .promise.then(function (doc) {
      pdfDoc = doc;
      loading.style.display = "none";
      renderPage(pageNum);
    })
    .catch(function (err) {
      loading.textContent = "Could not load PDF: " + err.message;
    });

  window.addEventListener("resize", function () {
    if (pdfDoc) queueRenderPage(pageNum);
  });
</script>

</body>
</html>
